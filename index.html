<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人口结构 × 生产力</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #F5F7FA;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .card {
    background: #FFFFFF;
    border-radius: 18px;
    padding: 44px 56px 48px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.07);
    width: 640px;
  }

  /* Column headers */
  .col-headers {
    display: grid;
    grid-template-columns: 1fr 80px 1fr;
    margin-bottom: 32px;
  }
  .col-header {
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    padding: 8px 0;
    border-radius: 8px;
    letter-spacing: 1px;
  }
  .col-header.left  { background: #FFF3DC; color: #9a6200; }
  .col-header.right { background: #EBF4FF; color: #1b4f86; }

  /* Rows */
  .rows {
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 80px 1fr;
    align-items: center;
  }
  .shape-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 8px;
  }

  /* Arrow connector */
  .connector {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .arrow-svg { display: block; }

  .divider {
    height: 1px;
    background: #EEF2F7;
  }

  .footer {
    text-align: center;
    margin-top: 36px;
    font-size: 10.5px;
    color: #c8d4e0;
  }
</style>
</head>
<body>
<div class="card">

  <!-- Column headers -->
  <div class="col-headers">
    <div class="col-header left">人口结构</div>
    <div></div>
    <div class="col-header right">生产力</div>
  </div>

  <div class="rows">

    <!-- Row 1 -->
    <div class="row">
      <!-- Left: Regular triangle (正三角) -->
      <div class="shape-cell">
        <svg width="160" height="120" viewBox="0 0 160 120">
          <polygon
            points="80,10 148,110 12,110"
            fill="#FFF3DC"
            stroke="#7A8FA0"
            stroke-width="2.5"
            stroke-linejoin="round"
          />
        </svg>
      </div>

      <!-- Arrow -->
      <div class="connector">
        <svg class="arrow-svg" width="60" height="24" viewBox="0 0 60 24">
          <line x1="4" y1="12" x2="48" y2="12" stroke="#C8D6E5" stroke-width="1.5"/>
          <polygon points="48,7 58,12 48,17" fill="#C8D6E5"/>
        </svg>
      </div>

      <!-- Right: Wide-top trapezoid (正梯形) -->
      <div class="shape-cell">
        <svg width="160" height="120" viewBox="0 0 160 120">
          <polygon
            points="14,10 146,10 118,110 42,110"
            fill="#EBF4FF"
            stroke="#7A8FA0"
            stroke-width="2.5"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Row 2 -->
    <div class="row">
      <!-- Left: Asymmetric hourglass (small inverted top + large bottom triangle) -->
      <div class="shape-cell">
        <svg width="160" height="120" viewBox="0 0 160 120">
          <!-- Top: small inverted triangle (▽ small, centered, upper half) -->
          <!-- Wide at top (narrow span), point meets center -->
          <polygon
            points="48,12 112,12 80,58"
            fill="#FFF3DC"
            stroke="#7A8FA0"
            stroke-width="2.5"
            stroke-linejoin="round"
          />
          <!-- Bottom: large upright triangle (△ large, full width, lower half) -->
          <!-- Point at center meets top triangle -->
          <polygon
            points="80,58 8,110 152,110"
            fill="#FFF3DC"
            stroke="#7A8FA0"
            stroke-width="2.5"
            stroke-linejoin="round"
          />
          <!-- Center dot -->
          <circle cx="80" cy="58" r="3" fill="#7A8FA0"/>
        </svg>
      </div>

      <!-- Arrow -->
      <div class="connector">
        <svg class="arrow-svg" width="60" height="24" viewBox="0 0 60 24">
          <line x1="4" y1="12" x2="48" y2="12" stroke="#C8D6E5" stroke-width="1.5"/>
          <polygon points="48,7 58,12 48,17" fill="#C8D6E5"/>
        </svg>
      </div>

      <!-- Right: Exaggerated inverted triangle (very acute, sharp bottom point) -->
      <div class="shape-cell">
        <svg width="160" height="120" viewBox="0 0 160 120">
          <polygon
            points="6,10 154,10 80,114"
            fill="#FDECEA"
            stroke="#7A8FA0"
            stroke-width="2.5"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </div>

  </div><!-- /rows -->

  <div class="footer">Generated by 小D · 2026</div>
</div>
</body>
</html>
