<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 时代的阶层重构</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', sans-serif;
    background: #ECEEF2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .card {
    background: #FFFFFF;
    border-radius: 20px;
    padding: 44px 60px 48px;
    box-shadow: 0 2px 20px rgba(0,0,0,0.08);
    width: 700px;
  }

  .header {
    text-align: center;
    margin-bottom: 38px;
  }
  .header h1 {
    font-size: 20px;
    font-weight: 700;
    color: #1a2b3c;
    letter-spacing: 1px;
  }
  .header p {
    font-size: 12px;
    color: #9aaabb;
    margin-top: 7px;
    line-height: 1.7;
  }

  .col-headers {
    display: grid;
    grid-template-columns: 1fr 72px 1fr;
    margin-bottom: 24px;
    gap: 0;
  }
  .col-header {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    padding: 7px 0;
    border-radius: 7px;
    letter-spacing: 1.5px;
  }
  .col-header.left  { background: #F0F0F0; color: #1a1a1a; border: 1.5px solid #1a1a1a; }
  .col-header.right { background: #F0F0F0; color: #1a1a1a; border: 1.5px solid #1a1a1a; }

  .rows { display: flex; flex-direction: column; gap: 0; }

  .era-block { padding: 20px 0; }
  .era-label {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    padding-left: 4px;
  }
  .era-tag {
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 999px;
    letter-spacing: 0.5px;
  }
  .era-tag.normal { background: #F0F0F0; color: #1a1a1a; }
  .era-tag.ai     { background: #F0F0F0; color: #1a1a1a; }
  .era-line { flex: 1; height: 1px; background: #EEF2F7; }

  .row {
    display: grid;
    grid-template-columns: 1fr 72px 1fr;
    align-items: center;
  }
  .shape-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .connector {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* annotation text */
  .annot {
    position: absolute;
    font-size: 10px;
    color: #7a8fa0;
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
    line-height: 1.3;
  }
  .annot.warn { color: #1a1a1a; font-weight: 600; }

  .divider { height: 1px; background: #EEF2F7; }

  .footer {
    text-align: center;
    margin-top: 36px;
    font-size: 10px;
    color: #c8d4e0;
  }
</style>
</head>
<body>
<div class="card">

  <div class="header">
    <h1>AI 时代的阶层重构</h1>
    <p>随着 AI 渗透生产，阶层流动趋于固化<br>极少数人驾驭 AI，生产绝大多数价值</p>
  </div>

  <div class="col-headers">
    <div class="col-header left">阶层结构</div>
    <div></div>
    <div class="col-header right">生产力分布</div>
  </div>

  <div class="rows">

    <!-- Row 1: Industrial era -->
    <div class="era-block">
      <div class="era-label">
        <span class="era-tag normal">工业时代</span>
        <div class="era-line"></div>
      </div>
      <div class="row">

        <!-- Triangle -->
        <div class="shape-cell" style="height:136px;">
          <svg width="170" height="116" viewBox="0 0 170 116">
            <polygon points="85,8 158,108 12,108"
              fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
          </svg>
          <div class="annot" style="top:16px; left:50%; transform:translateX(-50%);">精英层</div>
          <div class="annot" style="bottom:18px; left:50%; transform:translateX(-50%);">中产 + 大众</div>
        </div>

        <div class="connector">
          <svg width="56" height="20" viewBox="0 0 56 20">
            <line x1="4" y1="10" x2="44" y2="10" stroke="#1a1a1a" stroke-width="1.5"/>
            <polygon points="44,6 54,10 44,14" fill="#1a1a1a"/>
          </svg>
        </div>

        <!-- Trapezoid (wide top) -->
        <div class="shape-cell" style="height:136px;">
          <svg width="170" height="116" viewBox="0 0 170 116">
            <polygon points="12,8 158,8 128,108 42,108"
              fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
          </svg>
          <div class="annot" style="top:16px; left:50%; transform:translateX(-50%);">高产能</div>
          <div class="annot" style="bottom:18px; left:50%; transform:translateX(-50%);">广泛参与</div>
        </div>

      </div>
    </div>

    <div class="divider"></div>

    <!-- Row 2: AI era (distorted) -->
    <div class="era-block">
      <div class="era-label">
        <span class="era-tag ai">AI 时代 · 畸形</span>
        <div class="era-line"></div>
      </div>
      <div class="row">

        <!-- Extreme asymmetric hourglass -->
        <!-- Top: tiny inverted triangle (elite = very small, narrow) -->
        <!-- Bottom: very wide flat triangle (masses = huge, flat) -->
        <div class="shape-cell" style="height:160px;">
          <svg width="200" height="140" viewBox="0 0 200 140">
            <!-- Top: tiny narrow inverted triangle -->
            <polygon points="90,8 110,8 100,44"
              fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
            <!-- Bottom: very wide flat triangle, barely any height -->
            <polygon points="100,44 2,130 198,130"
              fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
            <circle cx="100" cy="44" r="2.5" fill="#1a1a1a"/>
          </svg>
          <div class="annot" style="top:10px; left:50%; transform:translateX(-50%);">少数精英</div>
          <div class="annot warn" style="top:46px; left:50%; transform:translateX(-50%);">中产消失</div>
          <div class="annot" style="bottom:14px; left:50%; transform:translateX(-50%);">庞大底层</div>
        </div>

        <div class="connector">
          <svg width="56" height="20" viewBox="0 0 56 20">
            <line x1="4" y1="10" x2="44" y2="10" stroke="#1a1a1a" stroke-width="1.5"/>
            <polygon points="44,6 54,10 44,14" fill="#1a1a1a"/>
          </svg>
        </div>

        <!-- Extremely flat wide inverted triangle (saucer/lens shape) -->
        <div class="shape-cell" style="height:160px;">
          <svg width="200" height="140" viewBox="0 0 200 140">
            <!-- Very wide, very flat inverted triangle -->
            <polygon points="2,8 198,8 100,132"
              fill="#FFFFFF" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
          </svg>
          <div class="annot" style="top:10px; left:50%; transform:translateX(-50%);">少数人 · 绝大多数产值</div>
          <div class="annot warn" style="bottom:10px; left:50%; transform:translateX(-50%);">多数人 · 贡献趋近于零</div>
        </div>

      </div>
    </div>

  </div>

  <div class="footer">Generated by 小D · 2026</div>
</div>
</body>
</html>
